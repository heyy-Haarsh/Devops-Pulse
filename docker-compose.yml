# Local run WITHOUT Kubernetes: app + Prometheus + Grafana on your machine.
#   docker compose up -d --build
#   Dashboard  http://localhost:8000
#   Prometheus http://localhost:9091   (9091 avoids clashing with a Prometheus port-forward)
#   Grafana    http://localhost:3002   (admin / devops-pulse)
# The Kubernetes deployment (k8s/ + monitoring/) is the main demo path.
services:
  app:
    build: .
    image: devops-pulse:compose
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: docker-compose
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
      PROMETHEUS_PUBLIC_URL: http://localhost:9091
      GRAFANA_PUBLIC_URL: http://localhost:3002

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus-docker.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: devops-pulse
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/devops-pulse.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
